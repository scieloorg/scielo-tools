{% load i18n wagtailadmin_tags %}

<li>
    {% icon name="manuscript" %}
    <a href="{% url 'wagtailsnippets_manuscript_manuscript:list' %}">
        {% blocktrans trimmed count counter=total_manuscripts with total_manuscripts|intcomma as total %}
            {{ total }} Manuscript <span class="w-sr-only">created in {{ site_name }}</span>
        {% plural %}
            {{ total }} Manuscripts <span class="w-sr-only">created in {{ site_name }}</span>
        {% endblocktrans %}
    </a>
</li>
