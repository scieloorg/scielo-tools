[mypy]
python_version = 3.14
check_untyped_defs = True
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unused_configs = True
plugins = mypy_django_plugin.main

[mypy.plugins.django-stubs]
django_settings_module = config.settings.test

[mypy-*.migrations.*]
ignore_errors = True

[coverage:run]
source =
    config
    core
    core_settings
    users
    xml_manager
    manuscript
    reference
    front
    body
omit =
    */migrations/*
    *migrations*
    *tests*
    */tests/*
    */templates/*

[coverage:report]
include =
    config/*
    core/*
    core_settings/*
    users/*
    xml_manager/*
    manuscript/*
    reference/*
    front/*
    body/*
