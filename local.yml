services:
  django: &django
    build:
      context: .
      dockerfile: ${DOCKERFILE:-./compose/local/django/Dockerfile}
      args:
        BUILD_ENVIRONMENT: local
    image: scielo_tools_local_django
    container_name: scielo_tools_local_django
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_started
      mailhog:
        condition: service_started
      ollama:
        condition: service_healthy
    volumes:
      - .:/app:z
      - ../packtools:/packtools:z
    entrypoint: ["/app/compose/production/django/entrypoint"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
    environment:
      SCMS_WEBAPP_VERSION: ${SCMS_WEBAPP_VERSION:-v0.0.4}
    ports:
      - "8000:8000"
    command: /start

  ollama:
    build:
      context: ./compose/ollama
    image: scielo_tools_local_ollama
    container_name: scielo_tools_local_ollama
    environment:
      OLLAMA_MODEL: qwen3.5:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=127.0.0.1:11434 ollama show \"$$OLLAMA_MODEL\" >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 900s

  mailhog:
    image: mailhog/mailhog:v1.0.0
    container_name: scielo_tools_local_mailhog
    ports:
      - "8029:8025"

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: scielo_tools_local_postgres
    container_name: scielo_tools_local_postgres
    volumes:
      - ../scms_data/scielo_tools/data_dev:/var/lib/postgresql:Z
      - ../scms_data/scielo_tools/data_dev_backup:/backups:z
    ports:
      - "5439:5432"
    env_file:
      - ./.envs/.local/.postgres

  redis:
    image: redis:8
    container_name: scielo_tools_local_redis
    ports:
      - "6399:6379"

  celeryworker:
    <<: *django
    image: scielo_tools_local_celeryworker
    container_name: scielo_tools_local_celeryworker
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_started
      mailhog:
        condition: service_started
      ollama:
        condition: service_healthy
    ports: []
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: scielo_tools_local_celerybeat
    container_name: scielo_tools_local_celerybeat
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_started
      mailhog:
        condition: service_started
      ollama:
        condition: service_healthy
    ports: []
    command: /start-celerybeat

volumes:
  ollama_data:
